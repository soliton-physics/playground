<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Live physics simulations for class 11 and 12: grab things, throw them, change the numbers and see the textbook answer beside the measured one. Mechanics, waves, thermodynamics, circuits, magnetism, optics and modern physics." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Soliton" />
    <meta property="og:title" content="Soliton Physics Playground" />
    <meta property="og:description" content="Live physics simulations for every NCERT class 11 and 12 chapter." />
    <meta property="og:image" content="https://solitonplay.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#e4e6ea" />
    <title>Soliton Playground</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // One address per simulation for search engines. A textbook scene has a page of its own at /sim/<id>, written
      // for search, so that is the one to show; anything else keeps only what picks the scene. An embedded copy is
      // kept out of the index altogether.
      (() => {
        const query = new URLSearchParams(location.search);
        const kept = new URLSearchParams();
        for (const key of ['mode', 'scenario', 'preset']) if (query.has(key)) kept.set(key, query.get(key));
        const scenario = query.get('scenario');
        // Every scenario outside the wave lab has its page (scripts/sim-pages.mjs makes one per catalogue entry).
        const page = scenario && /^[a-z0-9-]+$/.test(scenario) && query.get('mode') !== 'waves' ? `/sim/${scenario}` : undefined;
        const link = document.createElement('link');
        link.rel = 'canonical';
        link.href = 'https://solitonplay.com' + (page ?? '/play' + (kept.size ? '?' + kept : ''));
        document.head.append(link);
        if (query.has('embed')) {
          const robots = document.createElement('meta');
          robots.name = 'robots';
          robots.content = 'noindex';
          document.head.append(robots);
        }
      })();
    </script>
    <script>
      try {
        const asked = new URLSearchParams(location.search).get('theme');
        const saved = localStorage.getItem('soliton-theme');
        document.documentElement.dataset.theme = asked === 'light' || asked === 'dark' ? asked : (saved ?? 'light');
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <!-- Vercel Web Analytics: visits counted without cookies. -->
    <!-- Your own visits: open any page once with ?analytics=off and this browser is no longer counted; ?analytics=on undoes it. -->
    <script>(function () { var q = new URLSearchParams(location.search).get('analytics'); try { if (q === 'off') localStorage.setItem('soliton-analytics', 'off'); if (q === 'on') localStorage.removeItem('soliton-analytics'); } catch (e) {} var off = false; try { off = localStorage.getItem('soliton-analytics') === 'off'; } catch (e) {} window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); }; if (off) window.va('beforeSend', function () { return null; }); if (q === 'off' || q === 'on') alert(off ? 'Done: visits from this browser are no longer counted in Soliton analytics. Open any page with ?analytics=on to undo.' : 'Done: visits from this browser are counted again.'); })();</script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
